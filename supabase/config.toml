project_id = "construction-crm"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:4173"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enabled = true
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 200

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
